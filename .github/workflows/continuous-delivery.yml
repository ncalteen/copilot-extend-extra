name: Continuous Delivery

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pages: read

    # Manual runs must also deploy the production branch.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # prettier-ignore
      - name: Restore Cache
        id: cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Build
        id: build
        run: npm run build

      - name: Upload Pages Artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Release
    runs-on: ubuntu-latest

    needs: build

    permissions:
      contents: write

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Tag
        id: tag
        uses: issue-ops/semver@v3
        with:
          manifest-path: package.json
          workspace: ${{ github.workspace }}
          ref: main

      - name: Create Release
        id: release
        uses: issue-ops/releaser@v3
        with:
          tag: v${{ steps.tag.outputs.version }}
